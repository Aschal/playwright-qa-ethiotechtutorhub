name: QA - Playwright

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly 06:00 Addis Ababa
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Environment to test'
        default: 'https://ethiotechtutorhub.com'

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: ${{ inputs.base_url || 'https://ethiotechtutorhub.com' }}

# Live tests run on `vars.RUNNER` (repo Settings → Secrets and variables →
# Actions → Variables). Leave it unset for GitHub-hosted Ubuntu, or set it to
# `self-hosted` to run on your own machine, e.g. when the target's firewall
# blocks cloud data-center IPs.

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  # Gate: can this runner reach the target at all? Without it, an unreachable
  # host shows up as every test timing out for minutes, which hides the cause.
  reachability:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        shell: bash
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE_URL/" || true)
          echo "HTTP status from $BASE_URL: ${code:-none}"
          if [[ "$code" =~ ^[23] ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Target not reachable from this runner::$BASE_URL did not respond (status: ${code:-connection timeout}). The host's firewall likely drops cloud data-center traffic. Live tests were skipped; run them locally or set the RUNNER repo variable to a self-hosted runner."
          fi

  api:
    needs: [typecheck, reachability]
    if: needs.reachability.outputs.ok == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright test --project=api
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: report-api, path: playwright-report, retention-days: 14 }

  e2e:
    needs: api # fail fast: no point driving a browser if the endpoint is broken
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chrome, a11y]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.project }}
          path: |
            playwright-report
            test-results
          retention-days: 14
      - name: Publish JUnit summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: test-results/junit.xml
          check_name: Playwright (${{ matrix.project }})

  load:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: api
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: k6 run -e BASE_URL=$BASE_URL perf/search.k6.js
